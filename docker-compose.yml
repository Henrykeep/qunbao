services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
    ports:
      - "6099:6099"          # NapCat 网页后台，扫码登录用；登录后可在防火墙关掉
    volumes:
      - ./napcat/qq:/app/.config/QQ
      - ./napcat/config:/app/napcat/config

  qunbao:
    build: ./digest
    container_name: qunbao
    restart: always
    env_file: .env
    ports:
      - "8000:8000"          # 群报网页
    volumes:
      - ./data:/data
    depends_on:
      - napcat
