x-log: &log
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    logging: *log
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
    ports:
      - "6099:6099"          # NapCat 网页后台，扫码登录用；登录后可在防火墙关掉
    volumes:
      - ./napcat/qq:/app/.config/QQ
      - ./napcat/config:/app/napcat/config

  qunbao:
    build: ./digest
    container_name: qunbao
    restart: always
    logging: *log
    env_file: .env
    ports:
      - "8000:8000"          # 群报网页
    volumes:
      - ./data:/data
      - ./napcat/qq:/napcat_qq   # 只用来定期清 QQ 的图片/视频/语音缓存（群报看图不靠它）
    healthcheck:           # 容器卡死时 docker ps 会显示 unhealthy
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    depends_on:
      - napcat
